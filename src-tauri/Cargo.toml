[package]
name = "docproc4"
version = "0.1.0"
description = "PDF to Markdown via local OpenAI-compatible vision LLM servers"
authors = ["Vernon Sanders"]
license = "AGPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
futures-util = "0.3"
rfd = "0.15"
base64 = "0.22"
# PDF rendering, compiled from MuPDF's C source during the build (AGPL-3.0).
# Only what PDF pages need: the standard 14 fonts, plus system fonts as a
# fallback for PDFs that don't embed theirs.
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts", "system-fonts"] }

[profile.release]
opt-level = 2
incremental = true
