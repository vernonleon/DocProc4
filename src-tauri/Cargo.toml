[package]
name = "docproc4"
version = "0.1.0"
description = "PDF to Markdown via local OpenAI-compatible vision LLM servers"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
futures-util = "0.3"
rfd = "0.15"
base64 = "0.22"

[profile.release]
opt-level = 2
incremental = true
