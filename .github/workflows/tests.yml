name: Tests

# Runs the Rust tests (cargo test in src-tauri/) on every push and pull request.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  cargo-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # Tauri (WebKitGTK and friends), and clang + fontconfig for MuPDF
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev \
            clang libclang-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
